name: Website and content tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check website exercises, navigation and PDFs
        run: node website/test_site.mjs
      - name: Check published GitHub Pages files match the tested site
        run: node website/test_publish_sync.mjs
      - name: Check Python book generator syntax
        run: python3 -m py_compile maak_boekjes.py
  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install isolated test browsers
        run: |
          python -m pip install -r requirements-tests.txt
          python -m playwright install --with-deps chromium webkit
      - name: Test four levels, communication board and reading controls in browsers
        env:
          TEST_WEBKIT: "1"
        run: python -m unittest discover -s tests -v
