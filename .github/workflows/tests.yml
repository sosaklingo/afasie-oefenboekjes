name: Website and content tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check website exercises, navigation and PDFs
        run: node website/test_site.mjs
      - name: Check Python book generator syntax
        run: python3 -m py_compile maak_boekjes.py
